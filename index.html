<style>
/* ── styles/base.css ── */
/* SP Scene — design tokens + phone-viewport frame + shared primitives.
 * Risograph flyer language: offset pink/cyan/acid on dark.
 */

:root {
  /* Palette — matches the design mockup's TWEAKS block */
  --sp-pink: #FF2D87;
  --sp-cyan: #00E0FF;
  --sp-acid: #F5FF3C;
  --sp-bg: #0A0A0A;
  --sp-bg-soft: #141414;
  --sp-bg-card: #18151F;
  --sp-ink: #F2ECE0;
  --sp-ink-dim: rgba(242, 236, 224, 0.6);
  --sp-ink-mute: rgba(242, 236, 224, 0.35);
  --sp-line: rgba(242, 236, 224, 0.12);
  --sp-paper: #F0EEE9;

  /* Typography */
  --sp-font-display: "Archivo Narrow", "Oswald", Impact, sans-serif;
  --sp-font-body: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
  --sp-font-mono: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  background: var(--sp-paper);
  min-height: 100vh;
  font-family: var(--sp-font-body);
  color: var(--sp-ink);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ─── Phone viewport framing on desktop ──────────────────────── */
#sp-root {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sp-phone {
  width: 100%;
  max-width: 420px;
  height: min(100vh, 900px);
  background: var(--sp-bg);
  color: var(--sp-ink);
  position: relative;
  overflow: hidden;
  border-radius: 0;
  box-shadow: none;
}

@media (min-width: 720px) {
  body { padding: 24px; }
  .sp-phone {
    max-width: 402px;
    height: 874px;
    border-radius: 48px;
    box-shadow:
      0 40px 80px rgba(0, 0, 0, 0.18),
      0 0 0 1px rgba(0, 0, 0, 0.12);
  }
  .sp-phone::before {
    content: "";
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 37px;
    border-radius: 24px;
    background: #000;
    z-index: 80;
    pointer-events: none;
  }
  .sp-phone::after {
    content: "";
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 139px;
    height: 5px;
    border-radius: 100px;
    background: rgba(255, 255, 255, 0.7);
    z-index: 80;
    pointer-events: none;
  }
}

/* ─── Grain overlay (risograph texture) ──────────────────────── */
.sp-grain {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.08;
  mix-blend-mode: overlay;
  z-index: 70;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");
}

/* ─── Type ──────────────────────────────────────────────────── */
.sp-display {
  font-family: var(--sp-font-display);
  text-transform: uppercase;
  font-weight: 700;
  letter-spacing: 0.02em;
  line-height: 0.95;
}
.sp-label {
  font-family: var(--sp-font-display);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 600;
  font-size: 10px;
}
.sp-mono {
  font-family: var(--sp-font-mono);
  letter-spacing: -0.01em;
}
.sp-body { font-family: var(--sp-font-body); }

/* ─── Shared primitives: chips, priority badges, buttons ─────── */
.sp-chip {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: 999px;
  font-family: var(--sp-font-display);
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.12em;
  font-weight: 700;
  background: transparent;
  border: 1px solid var(--sp-line);
  color: var(--sp-ink);
  cursor: pointer;
  white-space: nowrap;
  transition: transform 0.08s ease;
}
.sp-chip:hover { transform: translateY(-1px); }
.sp-chip--on.sp-chip--pink { background: var(--sp-pink); color: #0A0A0A; border-color: var(--sp-pink); }
.sp-chip--on.sp-chip--cyan { background: var(--sp-cyan); color: #0A0A0A; border-color: var(--sp-cyan); }
.sp-chip--on.sp-chip--acid { background: var(--sp-acid); color: #0A0A0A; border-color: var(--sp-acid); }
.sp-chip--on { background: var(--sp-ink); color: #0A0A0A; border-color: var(--sp-ink); }

.sp-prio {
  display: inline-block;
  padding: 2px 6px;
  font-family: var(--sp-font-display);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 700;
}
.sp-prio-1 { background: var(--sp-acid); color: #0A0A0A; }
.sp-prio-2 { background: transparent; color: var(--sp-cyan); border: 1px solid var(--sp-cyan); }
.sp-prio-3 { background: transparent; color: var(--sp-ink-dim); border: 1px solid var(--sp-line); }

.sp-btn {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  width: 100%;
  height: 52px;
  border-radius: 999px;
  border: 1px solid var(--sp-line);
  background: var(--sp-bg-soft);
  color: var(--sp-ink);
  font-family: var(--sp-font-display);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease;
}
.sp-btn:active { transform: scale(0.98); }
.sp-btn--primary {
  background: var(--sp-ink);
  color: #0A0A0A;
  border-color: var(--sp-ink);
}
.sp-btn--pink {
  background: var(--sp-pink);
  color: #0A0A0A;
  border-color: var(--sp-pink);
}
.sp-btn--ghost {
  background: transparent;
  color: var(--sp-ink);
}

/* ─── Phone body scroll ──────────────────────────────────────── */
.sp-phone-body {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.sp-phone-body::-webkit-scrollbar { display: none; }

.sp-safe-top { padding-top: 54px; }
.sp-safe-bot { padding-bottom: 40px; }

/* Status bar stand-in */
.sp-statusbar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 48px;
  padding: 14px 28px 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  font-family: var(--sp-font-display);
  font-size: 14px;
  font-weight: 700;
  color: var(--sp-ink);
  z-index: 75;
  pointer-events: none;
}

/* Offline banner */
.sp-offline {
  position: absolute;
  top: 48px; left: 12px; right: 12px;
  z-index: 60;
  padding: 8px 12px;
  background: var(--sp-acid);
  color: #0A0A0A;
  font-family: var(--sp-font-display);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-size: 10px;
  font-weight: 700;
  text-align: center;
  border-radius: 8px;
}

/* Empty state */
.sp-empty {
  padding: 40px 24px;
  text-align: center;
  color: var(--sp-ink-dim);
  font-size: 14px;
}

/* Menu sheet (bottom sheet overlay) */
.sp-sheet {
  position: absolute;
  inset: 0;
  z-index: 90;
  background: rgba(0,0,0,0.6);
  display: flex; align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(4px);
}
.sp-sheet__panel {
  width: 100%;
  background: var(--sp-bg);
  border-top-left-radius: 24px;
  border-top-right-radius: 24px;
  padding: 14px 16px 32px;
  border-top: 1px solid var(--sp-line);
}
.sp-sheet__panel::before {
  content: "";
  display: block;
  width: 48px; height: 4px;
  background: var(--sp-ink-mute);
  border-radius: 999px;
  margin: 0 auto 12px;
}
.sp-sheet__item {
  display: block; width: 100%;
  text-align: left;
  padding: 14px 12px;
  background: transparent;
  border: 0;
  color: var(--sp-ink);
  font-family: var(--sp-font-display);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 13px;
  cursor: pointer;
  font-weight: 600;
  border-radius: 8px;
}
.sp-sheet__item:hover { background: var(--sp-bg-soft); }
.sp-sheet__item--danger { color: var(--sp-pink); }

/* Small screens — trim status chrome padding */
@media (max-width: 480px) {
  .sp-welcome { padding-top: 48px; }
  .sp-profile-setup { padding-top: 56px; }
}


/* ── styles/feed.css ── */
/* Feed screen: sticky topbar, view switcher, filter ribbon, day groups, event cards. */

.sp-topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  padding: 56px 16px 8px;
  background: linear-gradient(to bottom, rgba(10,10,10,1) 0%, rgba(10,10,10,0.92) 80%, rgba(10,10,10,0) 100%);
}
.sp-topbar__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.sp-logo {
  font-family: var(--sp-font-display);
  text-transform: uppercase;
  font-weight: 800;
  letter-spacing: -0.02em;
  font-size: 22px;
  color: var(--sp-ink);
  line-height: 1;
}
.sp-logo em { font-style: normal; color: var(--sp-pink); }

.sp-avatar {
  width: 36px; height: 36px;
  border-radius: 999px;
  background: var(--sp-cyan);
  color: #0A0A0A;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--sp-font-display);
  font-weight: 800;
  text-transform: uppercase;
  font-size: 13px;
  cursor: pointer;
  border: 2px solid var(--sp-ink);
}

/* View switcher: Today · Week · Map */
.sp-switcher {
  display: inline-flex;
  border: 1px solid var(--sp-line);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
  background: var(--sp-bg-soft);
}
.sp-switcher button {
  background: transparent;
  border: 0;
  color: var(--sp-ink-dim);
  font-family: var(--sp-font-display);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 10px;
  padding: 6px 12px;
  border-radius: 999px;
  cursor: pointer;
  font-weight: 700;
}
.sp-switcher button.is-on {
  background: var(--sp-pink);
  color: #0A0A0A;
}

/* Filter ribbon */
.sp-ribbon {
  position: sticky;
  top: 100px;
  z-index: 25;
  padding: 6px 0 10px;
  background: linear-gradient(to bottom, rgba(10,10,10,0.92) 0%, rgba(10,10,10,0.92) 70%, rgba(10,10,10,0) 100%);
  overflow-x: auto;
  scrollbar-width: none;
}
.sp-ribbon::-webkit-scrollbar { display: none; }
.sp-ribbon__inner {
  display: inline-flex;
  gap: 6px;
  padding: 0 16px;
  min-width: 100%;
}

/* Day heading */
.sp-day-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 16px 16px 8px;
  border-top: 1px solid var(--sp-line);
  margin-top: 4px;
  flex-wrap: wrap;
}
.sp-day-head:first-of-type { border-top: 0; margin-top: 0; }
.sp-day-head__num {
  font-family: var(--sp-font-display);
  font-size: 34px;
  font-weight: 800;
  line-height: 0.9;
  color: var(--sp-ink);
  text-transform: uppercase;
}
.sp-day-head__info {
  display: flex;
  flex-direction: column;
}
.sp-day-head__dow {
  font-family: var(--sp-font-display);
  text-transform: uppercase;
  font-size: 13px;
  letter-spacing: 0.12em;
  color: var(--sp-ink-dim);
}
.sp-day-head__month {
  font-family: var(--sp-font-display);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--sp-ink-mute);
  text-transform: uppercase;
}
.sp-day-head__badge {
  margin-left: auto;
  padding: 3px 8px;
  font-family: var(--sp-font-display);
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.12em;
  font-weight: 700;
}
.sp-day-head__badge--today { background: var(--sp-acid); color: #0A0A0A; }
.sp-day-head__badge--tomorrow { background: var(--sp-cyan); color: #0A0A0A; }

/* Event card */
.sp-events {
  padding: 0 16px 40px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.sp-card {
  background: var(--sp-bg-card);
  border: 1px solid var(--sp-line);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  transition: transform 0.1s ease;
}
.sp-card:active { transform: scale(0.99); }
.sp-card__art {
  height: 120px;
  position: relative;
  overflow: hidden;
}
.sp-card__art__title {
  position: absolute;
  inset: 0;
  padding: 14px;
  display: flex; align-items: flex-end;
  font-family: var(--sp-font-display);
  text-transform: uppercase;
  font-weight: 800;
  font-size: 28px;
  line-height: 0.9;
  color: #0A0A0A;
  mix-blend-mode: normal;
}
.sp-card__art__tag {
  position: absolute;
  top: 10px; right: 10px;
  display: flex; gap: 6px; align-items: center;
}
.sp-card__ongoing {
  position: absolute;
  top: 10px; left: 10px;
  padding: 2px 8px;
  background: var(--sp-pink);
  color: #0A0A0A;
  font-family: var(--sp-font-display);
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.12em;
  font-weight: 700;
  display: flex; align-items: center; gap: 4px;
}
.sp-card__ongoing::before {
  content: "";
  width: 6px; height: 6px;
  background: #0A0A0A;
  border-radius: 999px;
  animation: spPulse 1.2s infinite;
}
@keyframes spPulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

.sp-card__body { padding: 12px 14px 14px; }
.sp-card__time {
  font-family: var(--sp-font-display);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--sp-pink);
  margin-bottom: 2px;
}
.sp-card__name {
  font-family: var(--sp-font-display);
  text-transform: uppercase;
  font-weight: 800;
  font-size: 20px;
  line-height: 1;
  margin: 0 0 4px;
  color: var(--sp-ink);
}
.sp-card__venue {
  font-size: 13px;
  color: var(--sp-ink-dim);
  margin-bottom: 6px;
}
.sp-card__lineup {
  font-size: 12px;
  color: var(--sp-ink-mute);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 8px;
}
.sp-card__tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.sp-card__tags .sp-chip { cursor: default; font-size: 9px; padding: 3px 8px; }

@media (max-width: 480px) {
  .sp-topbar { padding-top: 48px; }
  .sp-ribbon { top: 96px; }
}

/* 2026-11-12: com a arte do evento, o título grande sai de cima da imagem
   (o nome continua logo abaixo, no corpo do cartão). */
.sp-art--img .sp-card__art__title,
.sp-art--img .sp-details__art__title { display: none; }
.sp-card__art { height: 150px; }

/* 2026-11-12: separador fino entre os grupos de filtros */
.sp-ribbon__sep {
  flex: 0 0 1px;
  align-self: stretch;
  margin: 4px 4px;
  background: var(--sp-line, rgba(255,255,255,0.18));
}


/* ── styles/details.css ── */
/* Event details screen (sp-details__*) — full-screen overlay above the feed. */

.sp-details {
  position: absolute; inset: 0;
  z-index: 40;
  background: var(--sp-bg);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.sp-details__body {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: none;
}
.sp-details__body::-webkit-scrollbar { display: none; }
.sp-details__art {
  height: 320px;
  position: relative;
  overflow: hidden;
}
.sp-details__art__title {
  position: absolute;
  inset: 0;
  padding: 20px;
  display: flex; align-items: flex-end;
  font-family: var(--sp-font-display);
  text-transform: uppercase;
  font-weight: 800;
  font-size: 48px;
  line-height: 0.9;
  color: #0A0A0A;
}
.sp-details__close {
  position: absolute;
  top: 48px; left: 16px;
  width: 40px; height: 40px;
  border-radius: 999px;
  background: rgba(10,10,10,0.7);
  color: var(--sp-ink);
  display: flex; align-items: center; justify-content: center;
  border: 0; cursor: pointer;
  z-index: 50;
  backdrop-filter: blur(12px);
}
.sp-details__content { padding: 20px 20px 40px; }
.sp-details__prio-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.sp-details__name {
  font-family: var(--sp-font-display);
  text-transform: uppercase;
  font-weight: 800;
  font-size: 34px;
  line-height: 0.95;
  margin: 0 0 4px;
}
.sp-details__venue {
  font-family: var(--sp-font-display);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--sp-cyan);
  font-size: 13px;
  margin-bottom: 14px;
}
.sp-details__meta {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  padding: 12px;
  background: var(--sp-bg-soft);
  border-radius: 10px;
  border: 1px solid var(--sp-line);
}
.sp-details__meta__item {
  display: flex; flex-direction: column; gap: 2px;
}
.sp-details__meta__item .sp-label { color: var(--sp-ink-mute); }
.sp-details__meta__item .sp-value {
  font-size: 14px;
  color: var(--sp-ink);
  font-family: var(--sp-font-body);
  font-weight: 500;
}
.sp-details__tags {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 16px;
}
.sp-details__tags .sp-chip { cursor: default; }
.sp-details__section { margin-bottom: 16px; }
.sp-details__section h3 {
  font-family: var(--sp-font-display);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 11px;
  color: var(--sp-acid);
  margin: 0 0 6px;
}
.sp-details__section p { margin: 0; font-size: 14px; color: var(--sp-ink-dim); line-height: 1.5; }
.sp-details__lineup-list {
  list-style: none; padding: 0; margin: 0;
  display: flex; flex-direction: column; gap: 4px;
}
.sp-details__lineup-list li {
  font-family: var(--sp-font-display);
  text-transform: uppercase;
  font-size: 15px;
  letter-spacing: 0.04em;
  color: var(--sp-ink);
  padding-left: 16px;
  position: relative;
}
.sp-details__lineup-list li::before {
  content: "";
  position: absolute;
  left: 0; top: 50%; transform: translateY(-50%);
  width: 8px; height: 1px; background: var(--sp-pink);
}
.sp-details__address {
  font-size: 14px;
  line-height: 1.5;
  color: var(--sp-ink);
  margin-bottom: 10px;
  word-wrap: break-word;
  user-select: all;
}
.sp-details__address-actions {
  display: flex; gap: 8px;
  flex-wrap: wrap;
}

.sp-details__actions {
  display: flex; gap: 10px;
  padding: 14px 20px 28px;
  background: var(--sp-bg);
  border-top: 1px solid var(--sp-line);
}


/* ── styles/map.css ── */
/* Map view wrapper + selected-pin card + Google InfoWindow styling. */

.sp-mapwrap {
  /* Sits directly under the MapScreen topbar (single row, no switcher). */
  position: absolute;
  top: 100px; left: 0; right: 0; bottom: 0;
  background: var(--sp-bg);
  display: flex; flex-direction: column;
  z-index: 5;
}
.sp-mapwrap__map {
  flex: 1;
  position: relative;
  background: #1e1e1e;
}

/* ─── Light Voyager tiles (no filter) for WCAG legibility ──────────
   CARTO Voyager gives ~12:1 road / ~18:1 label contrast natively.
   We don't invert or filter the tile pane — the map tab is light by design.
   The rest of the app remains dark; this surface opts for readability. */

/* Zoom controls — dark chip on light tiles, mirrors the app's dark UI. */
.sp-mapwrap__map .leaflet-control-zoom a {
  background: #0A0A0A;
  color: #F2ECE0;
  border: 1px solid #0A0A0A;
  font-weight: 700;
}
.sp-mapwrap__map .leaflet-control-zoom a:hover,
.sp-mapwrap__map .leaflet-control-zoom a:focus-visible {
  background: var(--sp-pink);
  color: #0A0A0A;
  outline: 3px solid var(--sp-acid);
  outline-offset: 2px;
}

/* Attribution — solid light bg with dark text for max legibility. */
.sp-mapwrap__map .leaflet-control-attribution {
  background: rgba(255, 255, 255, 0.92);
  color: #0A0A0A;
  font-size: 10px;
}
.sp-mapwrap__map .leaflet-control-attribution a {
  color: #005BA1; /* ~7:1 on white */
  font-weight: 600;
}

/* Subtle drop-shadow on every interactive marker so they "lift" off the tiles
   even when the bloom from cataracts compresses pale-on-pale contrast. */
.sp-mapwrap__map .leaflet-interactive {
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
}

/* ─── Marker focus ring (WCAG 2.4.7) ───────────────────────────── */
.sp-mapwrap__map .leaflet-interactive:focus,
.sp-mapwrap__map .leaflet-interactive:focus-visible {
  outline: 3px solid #0A0A0A;
  outline-offset: 3px;
  filter: drop-shadow(0 0 8px rgba(10, 10, 10, 0.9));
}

/* ─── Legend (color + size key, pinned top-right) ──────────────── */
/* Solid black pill with high-contrast white text. Sized for low-vision
   readability (≥14px body type on a dark, ~18:1 contrast chip). */
.sp-map-legend {
  position: absolute;
  top: 12px; right: 12px;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: #0A0A0A;
  border: 2px solid #FFFFFF;
  border-radius: 999px;
  font-family: var(--sp-font-display);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 14px;
  font-weight: 700;
  color: #FFFFFF;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
  line-height: 1;
}
.sp-map-legend__dot {
  display: inline-block;
  border-radius: 999px;
  border: 2.5px solid #FFFFFF;
  box-shadow: 0 0 0 1.5px #0A0A0A;
  flex-shrink: 0;
}
.sp-map-legend__dot--p1 { width: 16px; height: 16px; background: #F5FF3C; }
.sp-map-legend__dot--p2 { width: 14px; height: 14px; background: #00E0FF; }
.sp-map-legend__dot--p3 { width: 12px; height: 12px; background: #FF2D87; }
.sp-map-legend__label {
  color: #FFFFFF;
  font-size: 14px;
  font-weight: 700;
}
.sp-map-legend__count {
  margin-left: 6px;
  padding-left: 12px;
  border-left: 1.5px solid rgba(255, 255, 255, 0.5);
  color: #FFFFFF;
  font-size: 13px;
  text-transform: none;
  letter-spacing: 0.02em;
  font-weight: 600;
}
.sp-mapwrap__pane {
  position: absolute;
  left: 8px; right: 8px; bottom: 8px;
  max-height: 240px;
  overflow-y: auto;
  scrollbar-width: none;
  /* Must sit ABOVE Leaflet's internal panes. Leaflet stacks its tile/marker/
     popup panes at z-index 200–700; at the old z-index:10 the selected-event
     card rendered *behind* the map, so clicking a pin gave focus feedback but
     "nothing popped out" (reported bug). 1000 clears all Leaflet panes. */
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.sp-mapwrap__pane::-webkit-scrollbar { display: none; }
.sp-map-nokey {
  padding: 24px;
  text-align: center;
  color: var(--sp-ink-dim);
  font-size: 13px;
  line-height: 1.5;
}

/* Google InfoWindow (reserved for future use) */
.sp-mapinfo {
  background: var(--sp-bg-card);
  border: 1px solid var(--sp-line);
  border-radius: 10px;
  padding: 10px 12px;
  min-width: 220px;
  color: var(--sp-ink);
}
.sp-mapinfo__name { font-family: var(--sp-font-display); text-transform: uppercase; font-weight: 700; font-size: 14px; margin-bottom: 4px; }
.sp-mapinfo__venue { font-size: 12px; color: var(--sp-ink-dim); margin-bottom: 4px; }
.sp-mapinfo__time { font-family: var(--sp-font-display); letter-spacing: 0.12em; font-size: 10px; color: var(--sp-pink); text-transform: uppercase; margin-bottom: 8px; }
.sp-mapinfo__cta {
  background: var(--sp-pink); color: #0A0A0A; border: 0;
  padding: 6px 10px; border-radius: 999px;
  font-family: var(--sp-font-display); text-transform: uppercase;
  letter-spacing: 0.12em; font-size: 10px; font-weight: 700; cursor: pointer;
}

.sp-map2-status {

/* pinos */
.sp-pin { width: 30px; height: 30px; padding: 0; border: 0; background: none; cursor: pointer; }
.sp-pin__dot {
  position: absolute; inset: 4px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
  background: #0A0A0A; border: 3px solid var(--sp-pink); color: var(--sp-ink);
  font: 700 11px/1 var(--sp-font-display, sans-serif); box-shadow: 0 0 0 3px rgba(255,45,135,0.18), 0 4px 10px rgba(0,0,0,0.6);
  transition: transform 0.15s ease, background 0.15s ease;
}
.sp-pin.is-hot .sp-pin__dot { border-color: var(--sp-acid); box-shadow: 0 0 0 3px rgba(245,255,60,0.2), 0 4px 10px rgba(0,0,0,0.6); }
.sp-pin.is-approx .sp-pin__dot { border-style: dashed; }
.sp-pin.is-on { z-index: 5; }
.sp-pin.is-on .sp-pin__dot { transform: scale(1.3); background: var(--sp-pink); color: #0A0A0A; animation: spPinPulse 1.6s infinite; }
.sp-pin.is-on.is-hot .sp-pin__dot { background: var(--sp-acid); }
.sp-pin__label {
  position: absolute; top: 32px; left: 50%; transform: translateX(-50%); white-space: nowrap;
  max-width: 140px; overflow: hidden; text-overflow: ellipsis;
  padding: 2px 6px; border-radius: 6px; font-size: 11px; font-weight: 600;

@keyframes spPinPulse { 0%,100% { box-shadow: 0 0 0 3px rgba(255,45,135,0.35); } 50% { box-shadow: 0 0 0 10px rgba(255,45,135,0); } }
